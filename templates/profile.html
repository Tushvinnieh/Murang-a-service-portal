{% extends "base.html" %}
{% block title %}My Profile - Murang'a County{% endblock %}

{% block content %}
<div class="auth-container animate-fade-in">
    <div class="auth-card" style="max-width: 500px;">
        <!-- HEADER -->
        <div class="auth-header">
            <h2>My Profile</h2>
            <p>Update your personal details and security</p>
        </div>

        <!-- FORM -->
        <form method="POST" action="/profile" class="auth-form">
            
            <!-- NAME -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="{{ user.name }}" required placeholder="e.g., John Kamau">
            </div>

            <!-- EMAIL (READ ONLY) -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" value="{{ user.email }}" disabled style="background: #e2e8f0; cursor: not-allowed; color: #64748b;">
                <p class="helper-text">Email cannot be changed.</p>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="e.g., +254 712 345 678">
            </div>

            <!-- NEW PASSWORD (OPTIONAL) -->
            <div class="form-group">
                <label for="new_password">New Password (Optional)</label>
                <input type="password" id="new_password" name="new_password" placeholder="Leave blank to keep current">
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="btn-emerald-full">
                Save Changes <i class="fas fa-save"></i>
            </button>
        </form>

        <!-- FOOTER LINK -->
        <div class="auth-footer" style="border-top: none; padding-top: 1rem; margin-top: 1rem;">
            <a href="/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>
</div>

<!-- REUSE AUTH STYLES -->
<style>
    .auth-container {
        display: flex; justify-content: center; align-items: center;
        min-height: calc(100vh - 250px); padding: 2rem;
    }
    .auth-card {
        background: white; width: 100%; max-width: 500px;
        padding: 3rem; border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        border: 1px solid #e2e8f0;
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header h2 { color: #064e3b; font-size: 1.75rem; margin-bottom: 0.5rem; font-weight: 800; }
    .auth-header p { color: #64748b; font-size: 0.95rem; }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
        display: block; margin-bottom: 0.5rem; font-size: 0.75rem;
        font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .form-group input {
        width: 100%; padding: 0.875rem 1rem; border: 1px solid #cbd5e1;
        border-radius: 8px; font-size: 1rem; transition: all 0.2s;
        background: #f8fafc; color: #334155;
    }
    .form-group input:focus {
        outline: none; border-color: #064e3b; background: white;
        box-shadow: 0 0 0 3px rgba(6,78,59,0.1);
    }
    .helper-text { font-size: 0.8rem; color: #64748b; margin-top: 0.5rem; }

    .btn-emerald-full {
        width: 100%; background: #064e3b; color: white; padding: 1rem;
        border: none; border-radius: 8px; font-weight: 600; font-size: 1rem;
        cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        margin-top: 1rem;
    }
    .btn-emerald-full:hover { background: #047857; transform: translateY(-2px); }

    .back-link { color: #94a3b8 !important; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
    .back-link:hover { color: #064e3b !important; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
</style>
{% endblock %}
